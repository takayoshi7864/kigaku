<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>鑑定ハンドブック</title>
<style>
#gate{max-width:360px;margin:22vh auto 0;padding:0 20px;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#1b2127}
#gate h1{font-size:24px;margin:0 0 18px;letter-spacing:.06em}
#gate input[type=password]{width:100%;padding:13px;font-size:17px;border:1px solid #9aa4ad;border-radius:10px;box-sizing:border-box}
#gate label{display:block;margin:12px 0;font-size:14px}
#gate button{width:100%;padding:13px;font-size:17px;border:0;border-radius:10px;background:#1f2937;color:#fff}
#gate p{color:#b13f2d;min-height:1.5em;font-size:14px}
@media (prefers-color-scheme:dark){body{background:#0f1317}#gate{color:#e6e9ec}#gate input[type=password]{background:#171c22;color:#e6e9ec;border-color:#2a323a}#gate button{background:#e6e9ec;color:#0f1317}}
</style>
</head>
<body>
<main id="gate">
<h1>鑑定ハンドブック</h1>
<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="合言葉" autofocus>
<label><input id="rem" type="checkbox" checked> この端末で記憶する</label>
<button>開く</button><p id="msg"></p></form>
</main>
<script>
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const msg=t=>{const m=document.getElementById('msg');if(m)m.textContent=t};
const subtle=crypto.subtle;
async function loadEnc(){const r=await fetch('app.enc');return r.json()}
async function decrypt(key,enc){return new TextDecoder().decode(await subtle.decrypt({name:'AES-GCM',iv:b64d(enc.iv)},key,b64d(enc.data)))}
async function keyFromPw(pw,enc){const m=await subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return subtle.deriveKey({name:'PBKDF2',salt:b64d(enc.salt),iterations:enc.iter,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])}
function boot(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  if(doc.title)document.title=doc.title;
  doc.querySelectorAll('link[rel=stylesheet],style').forEach(n=>document.head.append(document.importNode(n,true)));
  const scripts=[...doc.querySelectorAll('script')];scripts.forEach(s=>s.remove());
  document.body.innerHTML='';
  [...doc.body.childNodes].forEach(n=>document.body.append(document.importNode(n,true)));
  for(const s of scripts){const e=document.createElement('script');e.textContent=s.textContent;document.body.append(e)}
}
(async()=>{
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  let enc;try{enc=await loadEnc()}catch{msg('読み込めませんでした。通信を確認してください。');return}
  // 専用リンク（#k=合言葉）で開いたときは、入力なしで復号して、この端末に記憶する
  const hm=location.hash.match(/^#k=(.+)$/);
  if(hm){try{const key=await keyFromPw(decodeURIComponent(hm[1]).trim(),enc),html=await decrypt(key,enc);
    try{const raw=new Uint8Array(await subtle.exportKey('raw',key));localStorage.setItem('kk',btoa(String.fromCharCode(...raw)))}catch{}
    history.replaceState(null,'',location.pathname+location.search);boot(html);return}catch{}}
  let saved=null;try{saved=localStorage.getItem('kk')}catch{}
  if(saved){try{const key=await subtle.importKey('raw',b64d(saved),'AES-GCM',false,['decrypt']);boot(await decrypt(key,enc));return}catch{try{localStorage.removeItem('kk')}catch{}}}
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();msg('');
    try{const key=await keyFromPw(document.getElementById('pw').value.trim(),enc),html=await decrypt(key,enc);
      if(document.getElementById('rem').checked){try{const raw=new Uint8Array(await subtle.exportKey('raw',key));localStorage.setItem('kk',btoa(String.fromCharCode(...raw)))}catch{}}
      boot(html)}catch{msg('合言葉が違います。')}
  };
})();
</script>
</body>
</html>
